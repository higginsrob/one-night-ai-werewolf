[project]
name = "omnivoice-service"
version = "0.1.0"
description = "OpenAI-compatible TTS + voice cloning API wrapping k2-fsa/OmniVoice"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "soundfile>=0.12.1",
  "numpy>=1.26.0",
  "omnivoice",
  "torch",
  "torchaudio",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
